[project]
name = "resilio-ai"
version = "0.1.0"
description = "Autonomous AI incident responder: pluggable telemetry, LLM-as-a-judge RCA, risk-tiered human-in-the-loop remediation."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "ResilioAI Contributors" }]
keywords = ["sre", "incident-response", "aiops", "langgraph", "llm", "observability", "remediation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "typer>=0.12",
    "rich>=13.7",
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-pyyaml>=6.0",
]

[project.scripts]
resilio = "resilio.cli:app"
resilio-cli = "resilio.cli:app"

[project.urls]
Homepage = "https://github.com/CoderHariswar/resilio-ai"
Documentation = "https://github.com/CoderHariswar/resilio-ai/tree/main/docs"
Issues = "https://github.com/CoderHariswar/resilio-ai/issues"

# Third-party plugins register providers through entry-point groups, e.g. in the
# plugin's own pyproject.toml:
#
#   [project.entry-points."resilio.telemetry"]
#   newrelic = "resilio_newrelic:NewRelicTelemetryProvider"
#
# Groups: resilio.telemetry, resilio.remediation, resilio.notifiers, resilio.llm

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resilio"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["resilio", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PT", "C4"]
ignore = [
    "S101", # assert is fine for typed narrowing and tests
    "B008",     # FastAPI/Typer use calls in argument defaults by design
    "B027",     # ABCs intentionally ship no-op optional hooks (initialize/aclose)
    "ASYNC109", # queue/drain APIs take an explicit timeout on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "PT018"]
"scripts/**" = ["S311"]
"resilio/utils/evaluator_benchmark.py" = ["S311"]
"resilio/providers/telemetry/mock.py" = ["S311"]
"resilio/providers/remediation/mock.py" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["resilio", "tests", "scripts", "examples"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
packages = ["resilio"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "psycopg_pool.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: end-to-end incident execution tests"]

[tool.coverage.run]
source = ["resilio"]
branch = true
omit = ["resilio/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
