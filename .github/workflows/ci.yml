name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: resilio # ephemeral CI service container only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:resilio@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen --python ${{ matrix.python }}
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  benchmark:
    name: Evaluator benchmark gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: 50-scenario offline benchmark (rules baseline)
        run: uv run resilio eval run --min-precision 0.95 --max-hallucination-escape 0.0

  container:
    name: Container build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: resilio-ai:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the Mock Mode stack
        run: docker compose up -d --wait
      - name: Smoke test
        run: |
          curl -fsS localhost:8000/healthz
          curl -fsS localhost:8000/readyz
          docker compose exec -T api resilio dev simulate --type disk-full --timeout 60 | tee out.txt
          grep -q "resolved" out.txt
          curl -fsS localhost:8000/metrics | grep 'resilio_incidents_total{status="resolved"} 1.0'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
