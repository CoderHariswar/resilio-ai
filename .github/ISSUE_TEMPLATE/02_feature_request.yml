name: Feature request
description: Propose a new capability or an improvement to an existing one.
title: "[feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What incident-response pain does this solve? Start from the on-call engineer's point of view.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? API/CLI sketches welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: safety
    attributes:
      label: Does this change what ResilioAI is allowed to do to production?
      description: Anything that widens autonomous actions needs a policy-engine story and probably an ADR.
      options:
        - "No - read-only / observability / DX"
        - "Yes - new or broader automated actions"
        - "Not sure"
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd like to implement this myself (we'll help!).
